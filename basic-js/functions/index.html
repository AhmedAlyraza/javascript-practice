<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Function Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="section">
        <h2>Functions Playground</h2>

        <input id="funcName" placeholder="Enter your name">

        <div class="btn-group">
            <button onclick="runFunction('greet')">Greet</button>
            <button onclick="runFunction('upper')">Uppercase</button>
            <button onclick="runFunction('length')">Length</button>
        </div>

        <div id="funcOut" class="output">Result will appear here</div>
    </div>
    <script src="script.js"></script>
</body>

</html>
