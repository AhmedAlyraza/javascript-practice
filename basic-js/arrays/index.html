<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Playground</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Array Playground</h1>

  <div class="section">
    <input id="arrInput" placeholder="Enter items (e.g. apple, banana, mango)">

    <div class="btn-group">
      <button onclick="handleArray('show')">Show</button>
      <button onclick="handleArray('count')">Count</button>
      <button onclick="handleArray('sort')">Sort</button>
      <button onclick="handleArray('reverse')">Reverse</button>
    </div>

    <div id="arrOut" class="output">Result will appear here</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
