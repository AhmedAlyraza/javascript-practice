<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Type Checker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <h1>Data Type Checker</h1>

  <div class="card">
    <input id="typeInput" placeholder="Enter value (e.g. 123, true, hello)">

    <button onclick="checkType()">Check Type</button>

    <div id="typeOut" class="output">Result will appear here</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
