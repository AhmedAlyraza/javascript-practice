<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <details ontoggle="myFunction()">
            <summary class="click">Enter Player's Name</summary>
            <div class="player-inputs">
                <div class="player">
                    <label for="player-x-name">Player X:</label>
                    <input type="text" id="player-x-name" placeholder="Enter name ">
                </div>
                <div class="player">
                    <label for="player-o-name">Player O:</label>
                    <input type="text" id="player-o-name" placeholder="Enter name ">
                </div>
            </div>
        </details>



        <div class="container">
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
            <button class="button-option"></button>
        </div>
        <button id="restart">Restart</button>
    </div>
    <div class="popup hide">
        <p id="message">Simple message</p>
        <button id="new-game">New Game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
