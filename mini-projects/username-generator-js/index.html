<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Username Generator App</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">
        <h2>Smart Username Generator App</h2>
        <div class="input-col">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="Enter...">
            <button onclick="generateName()">Generate</button>
        </div>

        <div class="output-col">
            <div class="result" id="result"></div>
            <p id="userNameCopy" style="cursor:pointer; color:blue;">copy</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
