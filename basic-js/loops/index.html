<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Loops Playground</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="section">
        <h2>Loops Playground</h2>

        <input id="loopInput" type="number" placeholder="Enter a number">

        <div class="btn-group">
            <button onclick="runLoop('all')">All Numbers</button>
            <button onclick="runLoop('even')">Even</button>
            <button onclick="runLoop('odd')">Odd</button>
        </div>

        <div id="loopOut" class="output">Result will appear here</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
