<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>JS Operators Playground</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>Operators Playground</h1>
    <div class="card">
      <div class="input-group">
        <input id="num1" type="number" placeholder="Enter first number">
        <input id="num2" type="number" placeholder="Enter second number">
      </div>
      <div class="btn-group">
        <button onclick="calculate('add')">+</button>
        <button onclick="calculate('sub')">-</button>
        <button onclick="calculate('mul')">×</button>
        <button onclick="calculate('div')">÷</button>
      </div>
      <div id="output_id" class="output_cls">Result will appear here</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
